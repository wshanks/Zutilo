<linkset>
  <html:link rel="localization" href="zutilo.ftl"/>
</linkset>
<vbox onload="initializePrefWindow();">
   <vbox class="main-section" id="zutilo-shortcuts-section">
      <label><html:h2 data-l10n-id='zutilo-preferences-functions'></html:h2></label>
      <!-- ONE list (preferences.js, ZutiloShortcutEditor): every function, its
           context-menu choices when it can be in a menu, and its shortcut; built
           by script, no inline handlers (Zotero's settings panes do not run
           them). -->
      <html:div id="zutilo-filter-row">
        <html:input type="search" id="zutilo-shortcut-filter" data-l10n-id="zutilo-preferences-shortcuts-filter"/>
        <html:button id="zutilo-filter-with" class="zutilo-filter-chip" aria-pressed="false" data-l10n-id="zutilo-preferences-filter-with"></html:button>
        <html:button id="zutilo-filter-without" class="zutilo-filter-chip" aria-pressed="false" data-l10n-id="zutilo-preferences-filter-without"></html:button>
      </html:div>
      <hbox id="zutilo-prefpane-menu-legend" class="zutilo-menu-legend" align="center"/>
      <html:p id="zutilo-shortcut-help" data-l10n-id="zutilo-preferences-shortcuts-help"></html:p>
      <html:div id="zutilo-shortcut-list" role="list"></html:div>
      <html:div id="zutilo-shortcut-status" role="status" aria-live="polite"></html:div>
   </vbox>

   <vbox class="main-section">
      <label><html:h2 data-l10n-id='zutilo-preferences-readme-caption'></html:h2></label>
      <groupbox>
          <vbox>
              <label is="zotero-text-link" data-l10n-id="zutilo-preferences-readme-button" data-l10n-attrs="href"/>
              <label is="zotero-text-link" data-l10n-id="zutilo-about-opengithub" href="https://github.com/wshanks/Zutilo"/>
          </vbox>
      </groupbox>

   </vbox>

</vbox>
